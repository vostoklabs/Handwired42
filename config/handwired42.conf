# User configuration for Handwired42
# (ZMK Studio itself is switched on from build.yaml, same as the Diplomat.)

# ---- Wireless + battery ----
# Bluetooth on, USB also works when plugged in (and charges the battery).
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# Report battery % to the host (shows up in Windows / macOS Bluetooth settings).
CONFIG_ZMK_BATTERY_REPORTING=y

# ---- No sleep ----
# Never go into deep sleep: the board stays connected and wakes instantly.
# The matrix is still interrupt-driven while idle, so standby draw stays low.
CONFIG_ZMK_SLEEP=n
